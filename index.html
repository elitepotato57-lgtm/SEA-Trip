:root{
  --bg:#0F1A1E; --surface:#152329; --raised:#1D3037; --line:#2A424B; --ink:#ECF2EE; --muted:#A3B5B0; --faint:#748A84;
  --sea:#0A1316; --land:#1A2B31; --land-trip:#23404A; --border-land:#3A5A64;
  --gaff:#F4B23E; --munch:#F2795A; --cool:#53C79E; --move:#76B7F2; --other:#B9A6E8;
  --accent:#F4B23E; --on-accent:#1C1406;
  --font-d:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-b:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0F1A1E; --surface:#152329; } }
:root[data-theme="dark"]{ --bg:#0F1A1E; --surface:#152329; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px}

.standalone #app{bottom:auto;height:var(--apph,100%)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:600px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:620px){ #app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }

.topbar{display:flex;align-items:center;gap:6px;padding:calc(2px + env(safe-area-inset-top,0px)) 8px 9px 4px;background:var(--hdr,var(--surface));flex:none;position:relative}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--orn,none) repeat-x left bottom/auto 6px;opacity:.85;pointer-events:none}
.topbar .icon-btn{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.06)}
.country-btn{display:flex;align-items:center;gap:8px;background:none;border:0;padding:3px 6px;border-radius:12px;text-align:left;cursor:pointer;flex:1;min-width:0}
.country-btn:hover{background:var(--raised)}
.country-btn .flag{font-size:21px;line-height:1}
.country-btn .cname{font-family:var(--font-d);font-weight:700;font-size:16.5px;letter-spacing:-.015em;display:block;line-height:1.1}
.country-btn .cmode{font-size:12px;line-height:1.2;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--raised);cursor:pointer;flex:none;text-decoration:none;color:var(--ink)}
.icon-btn[aria-current="page"]{border-color:var(--accent);color:var(--accent)}

main{flex:1;position:relative;min-height:0}
#mapview,#pageview{position:absolute;inset:0}
#pageview{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
[hidden]{display:none !important}

/* Labels sit just above the iPhone home indicator: the 34pt safe area minus the ~18pt the indicator itself needs */
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:3px 2px max(4px, calc(env(safe-area-inset-bottom,0px) - 18px));flex:none}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0 0;color:var(--faint);text-decoration:none;font:600 10.5px/1.15 var(--font-d);letter-spacing:0;white-space:nowrap}
nav.tabs .ico{width:42px;height:26px;display:grid;place-items:center;border-radius:13px}
nav.tabs .ico .i{width:21px;height:21px}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] .ico{background:var(--tint);color:var(--c)}

/* map */
#map{position:absolute;inset:0;background:var(--sea);font-family:var(--font-b)}
.leaflet-container{background:var(--sea)}
.leaflet-control-attribution{background:rgba(10,19,22,.75)!important;color:var(--faint)!important;font-size:10.5px}
.city-label span{position:absolute;transform:translate(-50%,7px);white-space:nowrap;font:600 12px var(--font-b);color:var(--muted);text-shadow:0 0 3px var(--sea),0 0 6px var(--sea);pointer-events:none;opacity:0;transition:opacity .2s}
#map.show-cities .city-label span{opacity:1}
.map-top{position:absolute;top:8px;left:0;right:0;z-index:600;display:flex;gap:6px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
.map-top::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:17px;border:1px solid var(--line);background:rgba(21,35,41,.94);color:var(--muted);font:700 14px var(--font-b);cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--c,var(--accent))}
.chip .dot{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}
.chip[aria-pressed="false"] .dot{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.map-side{position:absolute;right:8px;bottom:150px;z-index:600;display:flex;flex-direction:column;gap:7px}
.map-side .icon-btn{width:40px;height:40px;border-radius:12px;background:rgba(29,48,55,.96)}
.map-side .icon-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.basemap{display:none}
.basemap .seg{background:rgba(29,48,55,.96);border:1px solid var(--line)}
#map.sat .city-label span{display:none}
.leaflet-control-attribution{background:rgba(10,19,22,.8)!important;color:var(--muted)!important;font-size:10.5px}
.filter-panel{position:absolute;top:104px;left:10px;right:10px;z-index:650;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}
.near{position:absolute;left:0;right:0;bottom:0;z-index:600;padding:0 0 8px}
.near-title{display:inline-flex;align-items:center;gap:4px;margin:0 0 6px 8px;padding:4px 10px;border-radius:10px;background:rgba(21,35,41,.94);border:1px solid var(--line);font:700 12.5px var(--font-b);color:var(--muted);cursor:pointer}
.near-title .i{width:15px;height:15px;transition:transform .15s}
.near.closed .near-title .i{transform:rotate(180deg)}
.near-row{display:flex;gap:7px;overflow-x:auto;padding:0 8px;scroll-snap-type:x mandatory;scrollbar-width:none}
.near-row::-webkit-scrollbar{display:none}
.ncard{flex:none;width:68%;max-width:260px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px 11px;text-align:left;cursor:pointer;display:grid;gap:1px}
.ncard .k{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.ncard .k .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.ncard b{font:700 14.5px/1.2 var(--font-d);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ncard .m{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-msg{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

/* pages */
.page{padding:18px 16px 32px;position:relative}
.page::before{content:"";position:absolute;top:2px;right:-6px;width:200px;height:146px;background:var(--motif,none) no-repeat right top/contain;opacity:.26;pointer-events:none}
.page > *{position:relative}
.page h1{font:800 44px/0.95 var(--font-d);letter-spacing:-.035em;margin:0}
.page .sub{color:var(--muted);margin:6px 0 16px;font-size:15.5px}
.page h2{font:700 22px/1.15 var(--font-d);letter-spacing:-.02em;margin:0 0 4px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px}
.block p{margin:0 0 10px}
.note{font-size:13.5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scroller{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{background:var(--surface);height:36px}
.seg{display:inline-flex;background:var(--raised);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:130px}
select,input[type=text],input[type=number],input[inputmode],textarea{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;width:100%;color:var(--ink)}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:90px;resize:vertical}
.live{display:grid;gap:8px;padding:12px 14px;border:1px dashed var(--line);border-radius:16px;margin:0 0 14px}
.live .row{gap:6px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px;cursor:pointer}
.card:hover{border-color:var(--faint)}
.card .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card h3{font:700 18px/1.2 var(--font-d);letter-spacing:-.01em;margin:0}
.card .city{font-size:13.5px;color:var(--muted)}
.price{font-weight:700;text-align:right;white-space:nowrap}
.price small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:13.5px;margin-top:8px;align-items:center}
.tag{font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--muted)}
.tag.warn{color:#E9C27A}
.tag.good{color:var(--cool)}
.tr-out{margin-top:12px}
.tr-res{display:flex;gap:10px;align-items:flex-start;background:var(--raised);border-radius:14px;padding:14px}
.tr-text{flex:1;font-size:24px;line-height:1.35;color:var(--ink);word-break:break-word}
.cphoto{height:150px;margin:10px 0 8px;border-radius:12px;background:var(--raised);overflow:hidden;position:relative}
.cphoto img{width:100%;height:100%;object-fit:cover;display:block}
.cphoto .credit{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(10,19,22,.78);color:var(--ink);padding:2px 7px;border-radius:7px}
.ptrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.ptrack::-webkit-scrollbar{display:none}
.pslide{flex:0 0 100%;scroll-snap-align:center;height:240px;background:var(--raised)}
.pslide img{width:100%;height:100%;object-fit:cover;display:block}
.pcount{position:absolute;right:8px;top:8px;font-size:12px;font-weight:700;background:rgba(10,19,22,.8);color:var(--ink);padding:3px 8px;border-radius:9px}
.pdots{position:absolute;left:0;right:0;bottom:36px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.pdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.pdots i.on{background:#fff}
.sfield{position:relative}
.sfield input{width:100%;-webkit-appearance:none;appearance:none;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:600 16px var(--font-b);color:var(--ink);min-width:0}
.sfield input:focus{outline:2px solid var(--accent);outline-offset:1px}
.sfield input::placeholder{color:var(--faint)}
.sfield input::-webkit-search-cancel-button{display:none}
.sugs{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:50;background:var(--raised);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.sugs button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 12px;color:var(--ink);cursor:pointer;font-size:15px}
.sugs button:first-child{border-top:0}
.sugs button small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.sugs .hd{padding:7px 12px 3px;font-size:12px;color:var(--faint);border-top:1px solid var(--line)}
.tmap{height:260px;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:0 0 6px;background:var(--sea)}
.plan{display:grid;gap:10px}
.plan .pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.trip{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px;cursor:pointer}
.trip[aria-pressed="true"]{border-color:var(--move)}
.trip .sum{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.trip .big{font:800 22px/1.1 var(--font-d);letter-spacing:-.02em}
.leg{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.leg:first-of-type{border-top:0}
.leg .li{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--raised);color:var(--move)}
.leg b{font:700 15px var(--font-d)}
.leg .m{font-size:13.5px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(118,183,242,.18);color:var(--move);margin-right:6px}
.badge.cheap{background:rgba(83,199,158,.18);color:var(--cool)}
.getthere{font-size:13.5px;color:var(--muted);background:var(--raised);border-radius:12px;padding:10px 12px;margin-top:10px}
details.more{margin-top:8px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.photo .credit a{color:inherit}
.photo-next{position:absolute;right:8px;top:8px;border:0;border-radius:10px;background:rgba(10,19,22,.8);color:var(--ink);font-weight:700;padding:6px 10px;cursor:pointer}
.empty{border:1px dashed var(--line);border-radius:16px;padding:18px;color:var(--muted)}
.empty b{color:var(--ink);display:block;margin-bottom:4px;font-family:var(--font-d);font-size:17px}
.stars{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-weight:700}
.st5{position:relative;display:inline-flex;height:14px}
.st5 .on{position:absolute;inset:0 auto 0 0;overflow:hidden;display:inline-flex;white-space:nowrap}
.st5 svg{width:14px;height:14px;flex:none}
.st5 .off svg{fill:var(--line)}
.st5 .on svg{fill:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:14px;font-weight:700;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:var(--raised);color:var(--ink);text-align:center}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:2000}
.backdrop{position:absolute;inset:0;background:rgba(4,9,11,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:10px 18px 0;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.kind{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);font-weight:700}
.kind .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.sheet h2{font:800 30px/1.02 var(--font-d);letter-spacing:-.03em;margin:6px 0 2px}
.photo.has-img{padding:0;overflow:hidden;position:relative;display:block}
.photo img{display:block;width:100%;height:220px;object-fit:cover}
.photo .credit{position:absolute;left:8px;right:auto;bottom:8px;max-width:calc(100% - 16px);font-size:12px;background:rgba(10,19,22,.8);color:var(--ink);padding:4px 9px;border-radius:9px;text-decoration:none}
.photo{min-height:112px;border-radius:16px;background:var(--raised);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);margin:14px 0;padding:14px;text-align:center;font-size:14px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fact{background:var(--raised);border-radius:12px;padding:10px 12px;font-size:14.5px}
.fact .l{display:block;font-size:12.5px;color:var(--muted)}
.fact.wide{grid-column:1/-1}
.fact .unk{color:var(--faint)}
ul.known{margin:8px 0 0;padding-left:18px}
ul.known li{margin:3px 0}
.srcs{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.srcs a{color:var(--muted)}
h4{font:700 15px var(--font-d);margin:16px 0 4px;letter-spacing:-.01em}

/* tools */
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.conv .field{min-width:0}
.big-in{font:700 22px var(--font-d)!important;padding:12px!important}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:12px}
.quick div{background:var(--raised);border-radius:10px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.quick span{color:var(--muted)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.totals div{background:var(--raised);border-radius:12px;padding:10px}
.totals b{display:block;font:800 20px var(--font-d)}
.totals span{font-size:12.5px;color:var(--muted)}
.spend{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.spend .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.spend .what{flex:1;min-width:0}
.spend .what small{display:block;color:var(--muted)}
.spend .amt{text-align:right;font-weight:700;white-space:nowrap}
.spend .amt small{display:block;color:var(--muted);font-weight:400}
.daylabel{font:700 13px var(--font-b);color:var(--muted);margin:14px 0 2px}
.rate-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rate-row label{font-weight:700;min-width:90px}
.rate-row small{grid-column:1/-1;color:var(--muted);font-size:12.5px;margin-top:-4px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  return b && Math.abs(b - a) > 0.004 ? `£${fmtNum(a)}–${fmtNum(b)}` : `£${fmtNum(a)}`;
}
const gbpMin = it => it.p ? toGBP(it.p[0], it.cur) : null;
const dispCur = (cc, fallback) => (cc && D.countries[cc]) ? D.countries[cc].cur : fallback;
const convert = (v, from, to) => from === to ? v : v / rate(from) * rate(to);
function niceRound(v, cur){
  if (cur === "VND" || cur === "LAK" || cur === "IDR") return v >= 10000 ? Math.round(v / 1000) * 1000 : Math.round(v / 100) * 100;
  if (cur === "KHR") return Math.round(v / 500) * 500;
  if (cur === "THB") return v >= 50 ? Math.round(v / 5) * 5 : Math.round(v);
  return v >= 20 ? Math.round(v) : Math.round(v * 2) / 2;
}
function localRange(p, from, to){
  if (!p) return null;
  const vals = p.map(x => from === to ? x : niceRound(convert(x, from, to), to));
  return vals.length > 1 && vals[1] !== vals[0] ? `${money(vals[0], to)}–${fmtNum(vals[1])}` : money(vals[0], to);
}
const itemLocal = it => localRange(it.p, it.cur, dispCur(it.cc, it.cur));
const routeLocal = r => localRange(r.p, r.cur, dispCur(r.cc[0], r.cur));

/* ---------- geo ---------- */
function dist(a, b){
  const R = 6371, toR = x => x * Math.PI / 180;
  const dLa = toR(b.lat - a.lat), dLo = toR(b.lng - a.lng);
  const h = Math.sin(dLa/2)**2 + Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLo/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const distText = km => km < 1 ? `${Math.round(km*1000)} m away` : km < 20 ? `${km.toFixed(1)} km away` : `${Math.round(km).toLocaleString("en-GB")} km away`;
function inRing(lat, lng, ring){
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++){
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function countryAt(lat, lng){
  for (const c of GEO){ if (c.cc && c.p.some(r => inRing(lat, lng, r))) return c.cc; }
  // small islands may be missing from the outline, so fall back to a nearby trip city
  let best = null, bestKm = 60;
  for (const p of D.places){ const km = dist({lat, lng}, p); if (km < bestKm){ bestKm = km; best = p.cc; } }
  return best;
}

/* ---------- filtering & sorting ---------- */
function bestScore(it){
  const r = it.r ? it.r / 10 : 0.5;
  const g = gbpMin(it); const cheap = g == null ? 0.4 : Math.max(0, 1 - g / 25);
  let near = 0.5; if (userLoc){ near = Math.max(0, 1 - dist(userLoc, it) / 50); }
  return r * 0.4 + cheap * 0.4 + near * 0.2;
}
function sortItems(items, how){
  const arr = items.slice();
  const nullLast = (a, b, f, dir) => { const x = f(a), y = f(b); if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1; return dir * (x - y); };
  if (how === "near" && userLoc) arr.sort((a, b) => dist(userLoc, a) - dist(userLoc, b));
  else if (how === "rated") arr.sort((a, b) => nullLast(a, b, x => x.r, -1));
  else if (how === "dear") arr.sort((a, b) => nullLast(a, b, gbpMin, -1));
  else if (how === "match") arr.sort((a, b) => bestScore(b) - bestScore(a));
  else if (how === "az") arr.sort((a, b) => a.n.localeCompare(b.n));
  else if (how === "near") arr.sort((a, b) => nullLast(a, b, x => x.r, -1) || nullLast(a, b, gbpMin, 1));
  else arr.sort((a, b) => nullLast(a, b, gbpMin, 1) || nullLast(a, b, x => x.r, -1));
  return arr;
}
function passPrice(it, maxGBP){ if (!maxGBP) return true; const g = gbpMin(it); return g == null || g <= +maxGBP; }
function passRating(it, minR){ return !minR || (it.r != null && it.r / 2 >= minR); }

}

const RADII = [[2, "Within 2 km"], [10, "10 km"], [50, "50 km"], [0, "Anywhere"]];

/* ---------- transport planner ---------- */
const NET = D.net;
const HUB = Object.fromEntries(NET.hubs.map(h => [h[0], {id:h[0], n:h[1], lat:h[2], lng:h[3], g:h[4], island:h[5]}]));
const MODE_IC = {"Train":"train","Bus":"bus","Ferry":"ship","Flight":"plane","Minivan":"bus","Bus + ferry":"ship","Taxi":"car","Local ride":"car"};
const MODE_COL = {"Train":"--gaff","Bus":"--munch","Minivan":"--munch","Ferry":"--move","Bus + ferry":"--move","Flight":"--other","Taxi":"--cool","Local ride":"--cool"};
const FLIGHT_EXTRA = [2, 3], CHANGE_EXTRA = [0.5, 1];
const roadKm = (a, b) => dist(a, b) * 1.35;
function meterFare(km){
  const m = NET.taxi.meter; let f = m.flag, d = Math.max(0, km - 1);
  for (const [len, r] of m.bands){ const x = len == null ? d : Math.min(d, len); f += x * r; d -= x; if (d <= 0) break; }
  return f;
}
const LEGS = (() => {
  const opts = NET.edges.map(e => ({...e}));
  const hubs = Object.values(HUB);
  for (let i = 0; i < hubs.length; i++) for (let j = i + 1; j < hubs.length; j++){
    const a = hubs[i], b = hubs[j];
    if (a.island || b.island) continue;
    if (opts.some(o => (o.a === a.id && o.b === b.id) || (o.a === b.id && o.b === a.id))) continue;
    const km = roadKm(a, b); if (km > 60) continue;
    opts.push({a:a.id, b:b.id, mode:"Taxi", op:"Taxi, Grab or Bolt", dur:[km / 45, km / 30], p:null, cur:"THB", da:"hotel", db:"hotel",
      notes:[`About ${Math.round(km)} km by road`, "Check Grab or Bolt for the price"], src:[], verified:false});
  }
  return opts;
})();
const ADJ = {};
LEGS.forEach(o => { (ADJ[o.a] = ADJ[o.a] || []).push({o, to:o.b}); (ADJ[o.b] = ADJ[o.b] || []).push({o, to:o.a}); });
const isAir = h => h === "bkkair" || h === "dmk";
const GO12 = D.net.go12 || {};
const go12 = (a, b) => GO12[a] && GO12[b] ? `https://12go.asia/en/travel/${GO12[a]}/${GO12[b]}` : null;
const ISLAND_R = {samui:14, phangan:10, tao:5, phiphi:5, kohchang:14, lipe:3, railay:2};
let NODE = HUB;
const hubNode = id => ({id, n:HUB[id].n, lat:HUB[id].lat, lng:HUB[id].lng});
// Link a searched place (not one of the saved hubs) to the network with a local ride to the nearest hubs
function connectors(node, key){
  const legs = [];
  const add = (h, label) => {
    const km = roadKm(node, HUB[h]);
    const inBkk = dist(node, HUB.bkk) < 40 && dist(HUB[h], HUB.bkk) < 40;
    const m = inBkk ? meterFare(km) : null;
    legs.push({a:key, b:h, mode: inBkk ? "Taxi" : "Local ride", op: inBkk ? "Taxi, Grab or Bolt" : (label || "Taxi, Grab, songthaew or longtail boat, depending on the place"), dur:[Math.max(.15, km / 45), Math.max(.25, km / 28)],
      p: m ? [Math.round(m * 1.05), Math.round(m * 1.4)] : null, cur:"THB", da:null, db:null,
      notes:[`About ${Math.round(km)} km by road`, inBkk ? "Estimated from Bangkok’s taxi meter rates" : "Check Grab or Bolt for the price, or ask locally for a bus or songthaew"], src:[], verified:false});
  };
  for (const [h, r] of Object.entries(ISLAND_R)) if (dist(node, HUB[h]) <= r){ add(h, "Taxi, songthaew or scooter taxi"); return legs; }
  const ranked = Object.values(HUB).filter(h => !h.island && !isAir(h.id)).map(h => ({h:h.id, km:roadKm(node, h)})).sort((x, y) => x.km - y.km);
  const close = ranked.filter(x => x.km <= 170).slice(0, 3);
  if (close.length){ close.forEach(x => add(x.h)); return legs; }
  // further from the saved hubs but still in Thailand: link the two nearest by bus or taxi, flagged as an estimate
  if (countryAt(node.lat, node.lng) === "TH") ranked.slice(0, 2).forEach(x => legs.push({a:key, b:x.h, mode:"Bus", op:"Bus, minivan or taxi (check live)", dur:[x.km / 65, x.km / 45], p:null, cur:"THB", da:null, db:null,
    notes:[`About ${Math.round(x.km)} km by road`, "This stretch isn’t in the saved network yet, so the time is a rough estimate"], src:[], verified:false}));
  return legs;
}
function hubPaths(adj, from, to, maxLegs){
  const out = [];
  (function walk(at, seen, path){
    if (at === to && path.length){ out.push(path.slice()); return; }
    if (path.length === maxLegs) return;
    for (const {o, to:nx} of (adj[at] || [])){
      if (seen.has(nx) || (isAir(nx) && nx !== to)) continue;
      seen.add(nx); path.push({o, from:at, to:nx}); walk(nx, seen, path); path.pop(); seen.delete(nx);
    }
  })(from, new Set([from]), []);
  // a flight "from Bangkok" already leaves from an airport, so don't pair it with a leg to or from that airport
  return out.filter(legs => !legs.some((L, k) => {
    const nx = legs[k + 1];
    return nx && ((isAir(L.from) && L.to === "bkk" && nx.o.mode === "Flight") || (L.o.mode === "Flight" && L.to === "bkk" && isAir(nx.to)));
  }));
}
function planTrips(fromN, toN){
  if (!fromN || !toN) return [];
  const fk = fromN.id || "@from", tk = toN.id || "@to";
  if (fk === tk || (!fromN.id && !toN.id && dist(fromN, toN) < .3)) return [];
  NODE = Object.assign({}, HUB);
  const adj = {}; Object.keys(ADJ).forEach(k => adj[k] = ADJ[k].slice());
  const link = o => { (adj[o.a] = adj[o.a] || []).push({o, to:o.b}); (adj[o.b] = adj[o.b] || []).push({o, to:o.a}); };
  let extra = 0;
  [[fromN, "@from"], [toN, "@to"]].forEach(([n, key]) => { if (n.id) return; NODE[key] = {id:key, n:n.n, lat:n.lat, lng:n.lng}; connectors(n, key).forEach(link); extra++; });
  if (!fromN.id && !toN.id && roadKm(fromN, toN) <= 60){ const km = roadKm(fromN, toN); link({a:"@from", b:"@to", mode:"Taxi", op:"Taxi, Grab or Bolt", dur:[km / 45, km / 28], p:null, cur:"THB", da:null, db:null, notes:[`About ${Math.round(km)} km by road`], src:[], verified:false}); }
  let trips = hubPaths(adj, fk, tk, 3 + extra).map(legs => {
    let dmin = 0, dmax = 0, pmin = 0, pmax = 0, unpriced = 0, unverified = 0;
    legs.forEach((L, k) => {
      const o = L.o, fl = o.mode === "Flight";
      dmin += o.dur[0] + (fl ? FLIGHT_EXTRA[0] : 0) + (k ? CHANGE_EXTRA[0] : 0);
      dmax += o.dur[1] + (fl ? FLIGHT_EXTRA[1] : 0) + (k ? CHANGE_EXTRA[1] : 0);
      if (o.p){ pmin += toGBP(o.p[0], o.cur); pmax += toGBP(o.p[o.p.length - 1], o.cur); } else unpriced++;
      if (!o.verified) unverified++;
    });
    return {legs, dmin, dmax, mid:(dmin + dmax) / 2, pmin, pmax, unpriced, unverified};
  });
  if (!trips.length) return [];
  // local rides at either end are always unpriced outside Bangkok, so judge prices on the main legs
  const core = t => t.unpriced - t.legs.filter(L => L.from[0] === "@" || L.to[0] === "@").filter(L => !L.o.p).length;
  const best = Math.min(...trips.map(t => t.mid));
  trips = trips.filter(t => t.mid <= best * 2.5 + 2);
  const priced = trips.filter(t => !core(t));
  const keepUnpriced = new Set(trips.filter(t => core(t) && t.mid <= best * 1.6 + 1).sort((a, b) => (core(a) - core(b)) || (a.mid - b.mid)).slice(0, 3));
  trips = trips.filter(t => core(t) ? keepUnpriced.has(t)
    : !priced.some(u => u !== t && u.mid <= t.mid && u.pmin <= t.pmin && (u.mid < t.mid || u.pmin < t.pmin)));
  const fastest = trips.reduce((a, b) => a.mid <= b.mid ? a : b);
  const cheapPool = trips.filter(t => !core(t));
  const cheapest = cheapPool.length ? cheapPool.reduce((a, b) => a.pmin <= b.pmin ? a : b) : null;
  trips.forEach(t => { t.fastest = t === fastest; t.cheapest = t === cheapest; });
  trips.sort(ui.tp.sort === "cheap"
    ? (a, b) => (core(a) - core(b)) || (a.pmin - b.pmin) || (a.mid - b.mid)
    : (a, b) => (a.mid - b.mid) || (a.pmin - b.pmin));
  return trips.slice(0, 8);
}
function fh(h){
  if (h < 1) return `${Math.max(5, Math.round(h * 60 / 5) * 5)} min`;
  const r = Math.round(h * 2) / 2;

  Object.values(HUB).filter(h => h.n.toLowerCase().includes(q)).forEach(h => push(h.n, "Transport hub", hubNode(h.id)));
  D.cities.filter(c => c[0].toLowerCase().includes(q)).forEach(c => push(c[0], "Town", {n:c[0], lat:c[1], lng:c[2]}));
  D.places.filter(p => p.n.toLowerCase().includes(q) || p.city.toLowerCase().startsWith(q)).slice(0, 8).forEach(p => push(p.n, `${CAT[p.c].one}, ${p.city}`, {n:p.n, lat:p.lat, lng:p.lng}));

const TR_LANGS = [["th", "Thai"], ["km", "Khmer (Cambodia)"], ["vi", "Vietnamese"], ["lo", "Lao"], ["ms", "Malay"], ["id", "Indonesian"], ["zh-CN", "Chinese (Mandarin)"]];

const trState = {text:"", lang:null, out:"", outFor:"", status:""};
const trLang = () => trState.lang || (S.country === "SG" ? "zh-CN" : (TR_LANGS.find(l => l[0] === D.countries[S.country].lang) || TR_LANGS[0])[0]);
let trCache = {}; try { trCache = JSON.parse(localStorage.getItem("tr-cache") || "{}"); } catch(e){}
function paintTranslation(){
  const el = $("#tr-out"); if (!el) return;
  if (trState.status === "nokey"){ el.innerHTML = `<p class="note">Add your Google key in <a href="#setup">Settings</a> to translate here.</p>`; return; }
  if (trState.status === "error"){ el.innerHTML = `<p class="note">Couldn’t translate. Check your signal, and that Cloud Translation API is ticked on your Google key.</p>`; return; }
  if (!trState.out){ el.innerHTML = trState.status === "busy" ? `<p class="note">Translating…</p>` : ""; return; }
  el.innerHTML = `<div class="tr-res"><div class="tr-text" lang="${esc(trLang())}">${esc(trState.out)}</div><button class="icon-btn" id="tr-say" type="button" aria-label="Read it out loud">${icon("speaker")}</button></div>`;
  $("#tr-say").onclick = () => speak(trState.out, trLang());
}
async function doTranslate(){
  const text = trState.text.trim(), lang = trLang();
  if (!text){ trState.out = ""; trState.status = ""; paintTranslation(); return; }
  if (!googleKey()){ trState.status = "nokey"; paintTranslation(); return; }
  const k = lang + "|" + text;
  if (trCache[k]){ trState.out = trCache[k]; trState.status = ""; paintTranslation(); return; }
  trState.status = "busy"; if (trState.outFor !== k) trState.out = ""; paintTranslation();
  try {
    const r = await fetch(`https://translation.googleapis.com/language/translate/v2?key=${enc(googleKey())}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({q:text, source:"en", target:lang, format:"text"})});

    if (!r.ok || !j.data) throw new Error((j.error && j.error.message) || "failed");
    if (trState.text.trim() !== text || trLang() !== lang) return;
    trState.out = j.data.translations[0].translatedText; trState.outFor = k; trState.status = "";
    trCache[k] = trState.out;
    const keys = Object.keys(trCache); if (keys.length > 300) delete trCache[keys[0]];

  const voices = speechSynthesis.getVoices();
  const v = voices.find(x => x.lang.replace("_", "-").toLowerCase() === u.lang.toLowerCase()) || voices.find(x => x.lang.toLowerCase().startsWith(u.lang.slice(0, 2).toLowerCase()));

let gReady = null;
const googleKey = () => (S.gkey || GOOGLE_KEY_IN_FILE || "").trim();
function loadGoogle(){
  if (gReady) return gReady;
  const key = googleKey(); if (!key) return Promise.resolve(null);
  gReady = new Promise(res => {
    let done = false; const fin = v => { if (!done){ done = true; res(v); } };
    window.__seaGoogleReady = () => fin(window.google && google.maps && google.maps.importLibrary ? google.maps : null);
    const s = document.createElement("script");
    s.src = `https://maps.googleapis.com/maps/api/js?key=${enc(key)}&v=weekly&loading=async&callback=__seaGoogleReady`;
    s.async = true; s.onerror = () => fin(null);
    document.head.appendChild(s);
    setTimeout(() => fin(null), 12000);
  }).then(m => { if (!m) gReady = null; return m; });
  return gReady;
}
const gPlaceCache = {};
const G_FULL = ["location", "photos", "rating", "userRatingCount", "googleMapsURI"];
async function googlePlace(it, fields = G_FULL){
  if (!it) return null;
  const maps = await loadGoogle(); if (!maps) return null;
  let entry = gPlaceCache[it.id];
  if (entry){ const need = fields.filter(f => !entry.has.has(f)); if (need.length){ try { await entry.place.fetchFields({fields:need}); need.forEach(f => entry.has.add(f)); } catch(e){} } return entry.place; }
  try {
    const { Place } = await maps.importLibrary("places");
    let pid = null; try { pid = localStorage.getItem("gpid:" + it.id); } catch(e){}
    if (!pid){
      // ID-only search: free and unlimited on Google's pricing
      const { places } = await Place.searchByText({ textQuery: `${it.n}, ${it.city}`, fields: ["id"], locationBias: {lat: it.lat, lng: it.lng}, maxResultCount: 1 });
      if (!places || !places.length) return null;
      pid = places[0].id; try { localStorage.setItem("gpid:" + it.id, pid); } catch(e){}
    }
    const place = new Place({ id: pid });
    await place.fetchFields({ fields });
    gPlaceCache[it.id] = {place, has:new Set(fields)};
    return place;
  } catch(e){ return null; }
}
function applyGoogleExtras(it, pl){
  const el = $("#gRating");
  if (el && pl.rating) el.innerHTML = `<div class="note">Google: ${starsHTML(pl.rating * 2)} ${pl.userRatingCount ? `${pl.userRatingCount.toLocaleString("en-GB")} reviews` : ""}${pl.googleMapsURI ? `, <a href="${esc(pl.googleMapsURI)}" target="_blank" rel="noopener">open</a>` : ""}</div>`;

}

let photoObs = null;
function watchCardPhotos(root){
  if (photoObs) photoObs.disconnect();
  const slots = root.querySelectorAll("[data-ph]"); if (!slots.length) return;
  const fill = async slot => {
    const it = D.places.find(p => p.id === slot.dataset.ph); if (!it || slot.dataset.done) return;
    slot.dataset.done = "1";
    if (googleKey()){
      // only the "photos" field for cards: a cheaper lookup than the full one used when you open a place
      const pl = await googlePlace(it, ["photos"]);
      if (pl && pl.photos && pl.photos.length){ const img = new Image(); img.alt = ""; img.loading = "lazy"; img.src = pl.photos[0].getURI({maxWidth: 640}); img.onerror = () => slot.remove(); slot.appendChild(img); return; }
    }
    if (it.wp){ const ph = await loadPhoto(it); if (ph){ const img = new Image(); img.alt = ""; img.src = ph.src; img.onerror = () => slot.remove(); slot.appendChild(img); return; } }
    slot.remove();
  };
  if (!("IntersectionObserver" in window)){ slots.forEach(fill); return; }
  photoObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ photoObs.unobserve(e.target); fill(e.target); } }), {root:$("#pageview"), rootMargin:"0px 0px 120px 0px", threshold:.25});
  slots.forEach(s => photoObs.observe(s));
}

const photoCache = {};
async function loadPhoto(it){
  if (!it.wp || typeof fetch === "undefined") return null;
  if (it.wp in photoCache) return photoCache[it.wp];
  try {
    const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${enc(it.wp)}`);
    if (!res.ok) throw new Error("no page");
    const j = await res.json();
    const orig = j.originalimage, th = j.thumbnail;
    let src = null;
    if (orig && orig.width <= 1400) src = orig.source;
    else if (th && th.source) src = th.source.replace(/\/\d+px-/, "/800px-");
    photoCache[it.wp] = src ? {src, page: (j.content_urls && j.content_urls.mobile && j.content_urls.mobile.page) || `https://en.wikipedia.org/wiki/${enc(it.wp)}`} : null;
  } catch(e){ photoCache[it.wp] = null; }
  return photoCache[it.wp];
}

  </div>`;
  if (it.ap) body += `<p class="note">The pin is approximate. Directions goes to the real address.</p>`;
  body += `<div class="srcs">${it.verified ? `Checked ${esc(it.chk)}. Sources: ${it.src.map(s => `<a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(", ")}` : "Not checked yet. Prices are typical, not looked up, so confirm on the day."}</div>`;

  $("#sheetRoot").innerHTML = `<div class="sheet-wrap"><div class="backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="--c:${col}">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheet-head"><div><span class="kind"><span class="dot"></span>${esc(c.one)}${it.c === "cool" && it.t.length ? `, ${esc(it.t.join(", ").toLowerCase())}` : ""}</span>
        <h2 id="sheet-title">${esc(it.n)}</h2><div class="note">${esc(it.city)}, ${esc(D.countries[it.cc].name)}</div></div>
        <button class="icon-btn" data-close aria-label="Close">${icon("x")}</button></div>
      ${body}
    </div></div>`;
  const sheet = $("#sheetRoot .sheet");
  $("#sheetRoot").querySelectorAll("[data-close]").forEach(b => b.onclick = closeDetail);
  sheet.querySelector("button[data-close]").focus();
  highlightPin(it);
  const box0 = $("#photoBox");
  if (googleKey()) googlePlace(it).then(pl => {
    const box = $("#photoBox"); if (!box || box.dataset.id !== it.id) return;
    if (pl){ applyGoogleExtras(it, pl); if (pl.photos && pl.photos.length){ showGooglePhoto(box, it, pl); return; } }
    wikiInto(box, it);
  });
  else if (it.wp) wikiInto(box0, it);
}
function closeDetail(){ $("#sheetRoot").innerHTML = ""; highlightPin(null); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function openCountryPicker(){
  lastFocus = document.activeElement;
  $("#sheetRoot").innerHTML = `<div class="sheet-wrap"><div class="backdrop" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cp-title">
      <div class="grab" aria-hidden="true"></div>
      <div class="sheet-head"><h2 id="cp-title" style="margin:0 0 12px">Where are you?</h2><button class="icon-btn" data-close aria-label="Close">${icon("x")}</button></div>
      <button class="btn ${S.countryMode === "auto" ? "primary" : ""}" id="cp-auto" type="button" style="width:100%;margin-bottom:12px">${icon("locate")}Use my location</button>
      <div class="cgrid">${Object.entries(D.countries).map(([k, x]) => `<button data-pick="${k}" aria-pressed="${S.country === k && S.countryMode === "manual"}"><span class="f" aria-hidden="true">${x.flag}</span>${esc(x.name)}</button>`).join("")}</div>
      <p class="note" style="margin-top:12px">Picking a country here switches off automatic location until you turn it back on.</p>
    </div></div>`;
  $("#sheetRoot").querySelectorAll("[data-close]").forEach(b => b.onclick = closeDetail);
  $("#cp-auto").onclick = () => { S.countryMode = "auto"; persist(); closeDetail(); locate(true); };
  $("#sheetRoot").querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { closeDetail(); setCountry(b.dataset.pick, true); });
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheetRoot").innerHTML) closeDetail(); });

function setCountry(cc, manual){
  if (manual) S.countryMode = "manual";
  const changed = S.country !== cc;
  S.country = cc; persist();
  ["gaff","munch","cool"].forEach(k => ui.lists[k].city = "");
  if (changed && map){ const c = D.countries[cc]; reduceMotion ? map.setView(c.c, c.z) : map.flyTo(c.c, c.z, {duration:.8}); }
  rerender();
}

/* ---------- location ---------- */
const TEST_SPOTS = D.cities.map(c => c[0] === "Bangkok" ? ["Bangkok", 13.7466, 100.5393] : c);
function applyTestLocation(){
  if (!S.testLoc || S.testLoc === "off") return false;
  const c = TEST_SPOTS.find(x => x[0] === S.testLoc) || TEST_SPOTS[0];
  userLoc = {lat: c[1], lng: c[2]}; locStatus = "test";
  const cc = countryAt(userLoc.lat, userLoc.lng);
  if (S.countryMode === "auto" && cc && cc !== S.country){ S.country = cc; persist(); }
  return true;
}
function locate(prompted){
  if (applyTestLocation()){
    updateMe(); rerender();
    if (prompted){ if (map && ui.view === "map") map.setView([userLoc.lat, userLoc.lng], 13); toast(`Using your test location: ${S.testLoc}. Turn it off in Settings.`); }
    return;
  }
  if (!("geolocation" in navigator)){ locStatus = "unavailable"; renderHeader(); if (prompted) toast("Location isn’t available here. Pick a country instead."); return; }
  locStatus = "asking"; renderHeader();
  navigator.geolocation.getCurrentPosition(pos => {
    userLoc = {lat: pos.coords.latitude, lng: pos.coords.longitude};
    const cc = countryAt(userLoc.lat, userLoc.lng);
    locStatus = cc ? "ok" : "outside";
    if (S.countryMode === "auto" && cc && cc !== S.country) setCountry(cc, false);
    updateMe();
    if (prompted && map && ui.view === "map") map.setView([userLoc.lat, userLoc.lng], cc ? 12 : map.getZoom());
    rerender();
  }, err => {
    locStatus = err && err.code === 1 ? "denied" : "unavailable"; renderHeader();
    if (ui.view === "setup") renderPage();
    if (prompted) toast(locStatus === "denied" ? "Location is blocked. Pick a country instead." : "Couldn’t find you. Try again with signal.");
  }, {enableHighAccuracy:false, timeout:12000, maximumAge:600000});
}

/* ---------- map ---------- */
let map = null, pinLayer, routeLayer, meMarker, selMarker, landLayer, mapReady = false;
const SAT_URL = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
const SAT_LABELS = "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}";
let satLayer = null, satLabelLayer = null, satAttr = null, satOK = null;
const satLink = (lat, lng, z) => `https://www.google.com/maps/@?api=1&map_action=map&center=${(+lat).toFixed(5)},${(+lng).toFixed(5)}&zoom=${Math.round(z)}&basemap=satellite`;
function testSatellite(){
  return new Promise(res => {
    let done = false; const fin = v => { if (!done){ done = true; res(v); } };
    const img = new Image();
    img.onload = () => fin(true); img.onerror = () => fin(false);
    setTimeout(() => fin(false), 6000);
    img.src = SAT_URL.replace("{z}", "4").replace("{y}", "7").replace("{x}", "12");
  });
}
async function setBasemap(mode){
  if (!map) return;
  if (mode === "sat"){
    if (satOK === null){ ui.satChecking = true; renderMapUI(); satOK = await testSatellite(); ui.satChecking = false; }
    if (!satOK){ ui.basemap = "map"; ui.satHelp = true; ui.mapFilters = false; renderMapUI(); return; }
    if (!satLayer){
      satLayer = L.tileLayer(SAT_URL, {maxZoom:19, maxNativeZoom:18});
      satLabelLayer = L.tileLayer(SAT_LABELS, {maxZoom:19, maxNativeZoom:18});
      satAttr = L.control.attribution({position:"bottomleft", prefix:false}).addAttribution("Imagery © Esri, Maxar, Earthstar Geographics");
    }
    satLayer.addTo(map); satLabelLayer.addTo(map); satAttr.addTo(map);
    landLayer.setStyle({fillOpacity:0, opacity:0});
    $("#map").classList.add("sat");
    ui.basemap = "sat"; ui.satHelp = false;
  } else {
    if (satLayer){ map.removeLayer(satLayer); map.removeLayer(satLabelLayer); satAttr.remove(); }
    landLayer.setStyle({fillOpacity:1, opacity:1});
    $("#map").classList.remove("sat");
    ui.basemap = "map";
  }
  renderMapUI();
}
function ensureMap(){
  if (map || mapReady) return;
  mapReady = true;
  const mv = $("#mapview");
  mv.innerHTML = `<div id="map" role="application" aria-label="Map of Southeast Asia with saved places"></div>
    <div class="map-top" id="mapTop"></div>
    <div class="basemap" id="basemapSeg"></div>
    <div id="filterPanel"></div>
    <div class="map-side" id="mapSide"></div>
    <div class="near" id="near"></div>`;
  if (typeof L === "undefined"){
    $("#map").innerHTML = `<div class="map-msg"><div><b>The map couldn’t load.</b><br>It needs a connection the first time. Your lists in Gaffs, Munch and Cool still work.</div></div>`;
    return;
  }
  map = L.map("map", {zoomControl:false, attributionControl:false, minZoom:4, maxZoom:16, zoomSnap:.5, maxBounds:[[-16,82],[33,132]], maxBoundsViscosity:.7, preferCanvas:true});
  const feats = [];
  GEO.forEach(c => c.p.forEach(r => feats.push({type:"Feature", properties:{cc:c.cc}, geometry:{type:"Polygon", coordinates:[r]}})));
  landLayer = L.geoJSON({type:"FeatureCollection", features:feats}, {interactive:false, style: f => ({color:cssv("--border-land"), weight:1, fillColor: f.properties.cc ? cssv("--land-trip") : cssv("--land"), fillOpacity:1})}).addTo(map);
  const cities = L.layerGroup().addTo(map);
  D.cities.forEach(([n, la, ln]) => L.marker([la, ln], {interactive:false, keyboard:false, icon:L.divIcon({className:"city-label", html:`<span>${esc(n)}</span>`, iconSize:[0,0]})}).addTo(cities));
  routeLayer = L.layerGroup();
  const acc = cssv("--accent");
  for (let i = 0; i < D.trip.length - 1; i++){
    const a = D.trip[i], b = D.trip[i+1], fly = b[3] === 1;
    L.polyline([[a[0],a[1]],[b[0],b[1]]], {color:acc, weight: fly ? 2 : 3, opacity:.85, dashArray: fly ? "2 8" : "8 7", interactive:false}).addTo(routeLayer);
  }
  for (let i = 0; i < D.tripMaybe.length; i += 2){
    L.polyline([D.tripMaybe[i], D.tripMaybe[i+1]], {color:acc, weight:1.5, opacity:.5, dashArray:"2 8", interactive:false}).addTo(routeLayer);
  }
  if (ui.showRoute) routeLayer.addTo(map);
  pinLayer = L.layerGroup().addTo(map);
  const renderer = L.canvas({tolerance:10});
  pinLayer._r = renderer;
  map.on("zoomend", () => $("#map").classList.toggle("show-cities", map.getZoom() >= 6.5));
  const c = D.countries[S.country]; map.setView(c.c, c.z);
  $("#map").classList.toggle("show-cities", map.getZoom() >= 6.5);
  updateMe();
}
function mapItems(){
  return D.places.filter(p => ui.mapCats.has(p.c))
    .filter(p => p.c !== "gaff" || (passPrice(p, ui.mapMaxGBP) && passRating(p, ui.mapMinR)));
}
function drawPins(){
  if (!map) return;
  pinLayer.clearLayers();
  const ink = cssv("--sea");
  mapItems().forEach(p => {
    const m = L.circleMarker([p.lat, p.lng], {renderer:pinLayer._r, radius: p.c === "move" ? 6 : 7.5, color:ink, weight:2.5, fillColor:cssv(CAT[p.c].v), fillOpacity:1, bubblingMouseEvents:false});
    m.on("click", () => openDetail(p.id));
    m.bindTooltip(esc(p.n), {direction:"top", offset:[0,-6]});
    m.addTo(pinLayer);
  });
}
function highlightPin(it){
  if (!map) return;
  if (selMarker){ map.removeLayer(selMarker); selMarker = null; }
  if (it) selMarker = L.circleMarker([it.lat, it.lng], {radius:14, color:cssv(CAT[it.c].v), weight:2.5, fill:false, interactive:false}).addTo(map);
}
function updateMe(){
  if (!map) return;
  if (meMarker){ map.removeLayer(meMarker); meMarker = null; }
  if (userLoc) meMarker = L.circleMarker([userLoc.lat, userLoc.lng], {radius:8, color:"#ffffff", weight:3, fillColor:cssv("--move"), fillOpacity:1, interactive:false}).addTo(map);
}
function renderMapUI(){
  if (!$("#mapTop")) return;
  $("#mapTop").innerHTML = Object.entries(CAT).filter(([k]) => k !== "move").map(([k, c]) => `<button class="chip" style="--c:${cssv(c.v)}" data-cat="${k}" aria-pressed="${ui.mapCats.has(k)}"><span class="dot"></span>${c.label}</button>`).join("")
    + `<button class="chip" data-filters aria-pressed="${ui.mapFilters}">${icon("sliders","i s")}Filters</button>`;
  $("#mapTop").querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { const k = b.dataset.cat; ui.mapCats.has(k) ? ui.mapCats.delete(k) : ui.mapCats.add(k); renderMapUI(); });
  $("#mapTop").querySelector("[data-filters]").onclick = () => { ui.mapFilters = !ui.mapFilters; ui.satHelp = false; renderMapUI(); };

  const sb = $("#satBtn");
  if (sb){ sb.setAttribute("aria-pressed", ui.basemap === "sat"); sb.setAttribute("aria-label", ui.satChecking ? "Checking satellite" : ui.basemap === "sat" ? "Back to map view" : "Satellite view"); }
  const bm = null;
  if (bm){
    bm.innerHTML = `<div class="seg" role="group" aria-label="Map style"><button data-bm="map" aria-pressed="${ui.basemap !== "sat"}">Map</button><button data-bm="sat" aria-pressed="${ui.basemap === "sat"}">${ui.satChecking ? "Checking…" : "Satellite"}</button></div>`;
    bm.querySelectorAll("[data-bm]").forEach(b => b.onclick = () => setBasemap(b.dataset.bm));
  }
  if (ui.satHelp && map){
    const c = map.getCenter();
    $("#filterPanel").innerHTML = `<div class="filter-panel" role="dialog" aria-label="Satellite view">
      <b>Satellite can’t load inside Claude</b>
      <p class="note" style="margin:0">Claude stops apps from loading map pictures from other websites. Once the app has its own web address, satellite works right here on this map. For now, open this spot in Google Maps.</p>
      <div class="row"><a class="btn small primary" href="${esc(satLink(c.lat, c.lng, map.getZoom() + 1))}" target="_blank" rel="noopener">${icon("layers","i s")}Open in satellite view</a><button class="btn small" id="satOk" type="button">OK</button></div></div>`;
    $("#satOk").onclick = () => { ui.satHelp = false; renderMapUI(); };
  } else
  $("#filterPanel").innerHTML = ui.mapFilters ? `<div class="filter-panel">
      <label class="field">Sort the list<select id="mf-sort">${[["near","Nearest"],["rated","Best reviewed"],["cheap","Cheapest first"],["dear","Priciest first"],["match","Best match"]].map(([v,l]) => `<option value="${v}" ${ui.mapSort === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <div class="row"><label class="field">Gaffs: top price a night<select id="mf-max">${[["","Any"],["5","£5"],["8","£8"],["10","£10"],["15","£15"],["20","£20"]].map(([v,l]) => `<option value="${v}" ${String(ui.mapMaxGBP) === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="field">Gaffs: reviews<select id="mf-minr">${[[0,"Any"],[4,"4 stars and up"],[4.5,"4.5 stars and up"]].map(([v,l]) => `<option value="${v}" ${+ui.mapMinR === v ? "selected" : ""}>${l}</option>`).join("")}</select></label></div>
      <button class="btn small" id="mf-done" type="button">Done</button></div>` : "";
  if (ui.mapFilters && !ui.satHelp){
    $("#mf-sort").onchange = e => { ui.mapSort = e.target.value; renderNear(); };
    $("#mf-max").onchange = e => { ui.mapMaxGBP = e.target.value; drawPins(); renderNear(); };
    $("#mf-minr").onchange = e => { ui.mapMinR = +e.target.value; drawPins(); renderNear(); };
    $("#mf-done").onclick = () => { ui.mapFilters = false; renderMapUI(); };
  }
  $("#mapSide").innerHTML = `<button class="icon-btn" id="satBtn" aria-label="Satellite view" aria-pressed="false">${icon("layers")}</button><button class="icon-btn" id="locBtn" aria-label="Show where I am">${icon("locate")}</button><button class="icon-btn" id="fitBtn" aria-label="Show the whole country">${icon("fit")}</button>`;
  $("#satBtn").onclick = () => setBasemap(ui.basemap === "sat" ? "map" : "sat");
  $("#locBtn").onclick = () => { if (userLoc && map){ map.setView([userLoc.lat, userLoc.lng], 12); } locate(true); };
  $("#fitBtn").onclick = () => { if (map){ const c = D.countries[S.country]; map.setView(c.c, c.z); } };
  drawPins(); renderNear();
}
function renderNear(){
  const el = $("#near"); if (!el) return;
  let items = mapItems();
  let title;
  if (userLoc && (locStatus === "ok" || locStatus === "test")){ title = "Closest to you"; }
  else { items = items.filter(p => p.cc === S.country); title = `In ${D.countries[S.country].name}`; }
  const how = ui.mapSort === "near" && !userLoc ? "rated" : ui.mapSort;
  items = sortItems(items, how).slice(0, 15);
  const side = $("#mapSide"); 
  if (!items.length){ el.innerHTML = `<span class="near-title">Nothing to show. Turn a category on.</span>`; if (side) side.style.bottom = "56px"; return; }
  el.classList.toggle("closed", !!S.nearClosed);
  el.innerHTML = `<button class="near-title" type="button" aria-expanded="${!S.nearClosed}">${esc(title)}${icon("chev","i")}</button>${S.nearClosed ? "" : `<div class="near-row">`}${S.nearClosed ? "" : items.map(p => {
    const c = CAT[p.c]; const pr = itemLocal(p);
    const bits = [userLoc ? distText(dist(userLoc, p)) : p.city, pr ? `${pr} (${gbpRange(p.p, p.cur)})` : null, p.r != null ? `${(p.r/2).toFixed(1)} stars` : null].filter(Boolean);
    return `<button class="ncard" style="--c:${cssv(c.v)}" data-near="${p.id}"><span class="k"><span class="dot"></span>${c.one}</span><b>${esc(p.n)}</b><span class="m">${esc(bits.join(", "))}</span></button>`;
  }).join("") + `</div>`}`;
  el.querySelector(".near-title").onclick = () => { S.nearClosed = !S.nearClosed; persist(); renderNear(); };
  if (side) side.style.bottom = (el.offsetHeight + 8) + "px";
  el.querySelectorAll("[data-near]").forEach(b => b.onclick = () => {
    const p = D.places.find(x => x.id === b.dataset.near);
    if (map){ reduceMotion ? map.setView([p.lat, p.lng], Math.max(map.getZoom(), 13)) : map.flyTo([p.lat, p.lng], Math.max(map.getZoom(), 13), {duration:.6}); }
    openDetail(p.id);
  });
}

/* ---------- full-height fix for home-screen mode ---------- */
function fitStandalone(){
  const sa = window.navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  const root = document.documentElement;
  root.classList.toggle("standalone", !!sa);
  if (!sa) return;
  const portrait = innerHeight >= innerWidth;
  const full = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
  const gap = full - innerHeight;
  root.style.setProperty("--apph", gap > 0 && gap <= 100 ? full + "px" : "100%");
}
fitStandalone();
window.addEventListener("resize", fitStandalone);
window.addEventListener("orientationchange", () => setTimeout(fitStandalone, 300));

/* ---------- boot ---------- */
$("#countryBtn").onclick = openCountryPicker;
show(currentView());
if (applyTestLocation()){ updateMe(); if (map) map.setView([userLoc.lat, userLoc.lng], 12); renderHeader(); rerender(); }
else if (S.countryMode === "auto") locate(false);
window.addEventListener("resize", () => { if (ui.view === "map") renderNear(); });
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude\.ai|claudeusercontent/.test(location.hostname)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
